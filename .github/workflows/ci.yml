name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Install display and font dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libfontconfig1 libx11-6

      # Both heads, the library and the gallery. Warnings fail the build: the
      # tree is warning-free, and a new NuGet security advisory surfaces here.
      - name: Build
        run: dotnet build Uno.Effects.slnx -c Release -warnaserror

      # Every effect at a fixed 1/60 s timestep, twice, hashed and compared. The
      # exit code is the result: non-determinism or a blank effect fails it.
      - name: Render tests (Skia Desktop)
        run: |
          xvfb-run -a samples/Gallery/Uno.Effects.Gallery/bin/Release/net10.0-desktop/Uno.Effects.Gallery \
            --render-tests --output render-tests | tee render-tests.log

      - name: Upload render-test frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-tests-desktop
          path: |
            render-tests/
            render-tests.log
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack src/Uno.Effects.Particles -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
